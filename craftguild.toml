schema_version = 2
rust_output_layout = "standard"
standards_version = "0.1.0"

[[releases]]
id = "musubi"
initial_version = "0.1.0"
tag_prefix = "v"
notes = "docs/releases"
paths = [".agents", ".github", ".gitignore", "AGENTS.md", "Cargo.lock", "Cargo.toml", "LICENSE-APACHE", "LICENSE-MIT", "Makefile", "NOTICE.md", "README.md", "craftguild.toml", "crates", "docs", "external-acceptance", "release-fixture", "rust-toolchain.toml", "rustfmt.toml", "safe-v141-sdk-input", "safe-v141-sdk.toml", "scripts", "standards", "tests", "tools"]
[[releases.cargo]]
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
workspace = true
packages = ["musubi", "musubi-alloy", "musubi-cli", "musubi-codegen", "musubi-core", "musubi-runtime", "musubi-safe", "musubi-testkit"]

[[policies]]
kind = "publication"
repository = "craftguild/musubi.rs"
manifest = "Cargo.toml"

[[policies]]
kind = "dependencies"
manifest = "Cargo.toml"
[policies.layers]
"musubi" = ["musubi-alloy", "musubi-core", "musubi-runtime", "musubi-safe"]
"musubi-alloy" = ["musubi-core", "musubi-runtime"]
"musubi-cli" = ["musubi-codegen", "musubi-core"]
"musubi-codegen" = ["musubi-core", "musubi-runtime", "musubi-testkit"]
"musubi-core" = []
"musubi-runtime" = ["musubi-core"]
"musubi-safe" = ["musubi-alloy", "musubi-core", "musubi-runtime"]
"musubi-testkit" = ["musubi-codegen", "musubi-core", "musubi-runtime"]
[policies.restricted]
"musubi-safe-v141-generated" = ["musubi-alloy", "musubi-safe"]

[[artifacts]]
id = "musubi-cli"
command = "musubi"
project = "musubi.rs"
kind = "rust"
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
package = "musubi-cli"
inputs = ["Makefile", "tools/standards.sh", "scripts/python.sh", "standards/engine.json", "standards/launcher.py", "standards/make/common.mk", "crates/musubi-cli/assets/version-banner.txt"]

[artifacts.build]
toolchain = "1.95.0"

[[adapters]]
language = "rust"
test = ["sh", "scripts/validate.sh"]
format = ["sh", "scripts/python.sh", "scripts/standards-language.py", "format"]
lint = ["sh", "scripts/python.sh", "scripts/standards-language.py", "lint"]

[[commands]]
id = "release-version-ownership"
purpose = "Validate workspace ownership in memory without releasing or signing"
phase = "check"
argv = ["sh", "tools/standards.sh", "check-release-config"]

[[commands]]
id = "standards-tooling"
purpose = "Check Python parsing and shell syntax of product tools"
phase = "check"
argv = ["sh", "scripts/python.sh", "scripts/standards-language.py", "tooling"]

[[commands]]
id = "cli-artifact-acceptance"
purpose = "Verify the actual copied CLI, closed product metadata and SBOM offline; install only into a temporary destination"
phase = "acceptance"
argv = ["sh", "scripts/python.sh", "scripts/standards-acceptance.py"]

[[generated]]
owner = "musubi-safe-v141-generated"
manifest = ".craftguild/ownership/musubi-safe-v141-generated.json"
output_root = "crates/musubi-safe-v141-generated"
reproduce = ["cargo", "+1.95.0", "run", "--locked", "--quiet", "--target-dir", "target/product-tests", "-p", "musubi-codegen", "--example", "reproduce-owned", "--", "safe-v141-sdk.toml", "{output}"]
rust_size_exception = true

